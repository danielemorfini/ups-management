<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        h2 { margin-top: 0; }
        .info { color: #337ab7; }
        .warning { color: #d9534f; }
        .success { color: #5cb85c; }
        .critical { color: #c9302c; text-decoration: underline; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="{{CLASS}}">{{SUBJECT}}</h2>
        <div>{{BODY}}</div>
        {{TABLE}}
    </div>
</body>
</html>
